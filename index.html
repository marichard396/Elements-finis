<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyse éléments finis 3D</title><meta name="theme-color" content="#0b0f14">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f14;color:#e6edf3;font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
:root{--bg:#0b0f14;--panel:#0e131a;--card:#121821;--line:#232b36;--mut:#8b96a5;--acc:#e8734f;--ok:#3fb96a;--bad:#e5534b;--warn:#d9a53a}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:330px 1fr 290px;grid-template-rows:52px 1fr 26px;height:100%}
#top{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.filetab{display:none}
#ptabs{display:flex;align-items:center;gap:6px;margin-left:10px;min-width:0;flex:0 1 auto;overflow-x:auto;scrollbar-width:none;padding:2px 0}
#ptabs::-webkit-scrollbar{display:none}
.ptab{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;max-width:230px;min-width:84px;white-space:nowrap;flex:0 1 auto}
.ptab:hover{border-color:#3a4554}
.ptab.on{border-color:var(--acc);background:#161d28;font-weight:600}
.ptab .nm{overflow:hidden;text-overflow:ellipsis}
.ptab .dirty{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.ptab .x{flex:none;border:0;background:none;color:var(--mut);cursor:pointer;width:20px;height:20px;border-radius:4px;line-height:1;padding:0;font-size:15px}
.ptab .x:hover{background:#2a3340;color:#fff}
.ptab-add{flex:none;width:28px;height:28px;border:1px dashed #3a4554;border-radius:6px;background:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1}
.ptab-add:hover{color:#fff;border-color:var(--mut)}
.split{display:inline-flex}.split .btn:first-child{border-radius:6px 0 0 6px}.split .caret{border-radius:0 6px 6px 0;border-left:0;padding:5px 7px}
.dropdown{display:none;position:absolute;right:0;top:34px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;z-index:20;min-width:220px;box-shadow:0 8px 24px #0008}
.dropdown.open{display:block}
.dropdown button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer;text-align:left}
.dropdown button:hover{background:#1c2430}
.defscale{display:flex;justify-content:space-between;font:11px ui-monospace,Consolas,monospace;color:var(--mut);margin-top:2px}
.sp{flex:1}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4554;background:#161d28}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#16100d;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ff8a7a}
.btn.wide{width:100%;padding:8px 11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);border:0;border-right:1px solid var(--line);padding:5px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:#161d28}
.seg button.on{background:#e6edf3;color:#0b0f14;font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1}
.menu{position:relative}
#viewMenu{display:none;position:absolute;right:0;top:34px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;z-index:20;min-width:200px;box-shadow:0 8px 24px #0008}
#viewMenu.open{display:block}
#viewMenu label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
#left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;margin:0 0 0 14px;border-left:1px solid var(--line)}
#steps{display:flex;border-bottom:1px solid var(--line)}
#steps button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 2px 7px;cursor:pointer;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
#steps button.on{color:#fff;font-weight:600;border-bottom-color:var(--acc)}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #4a5665;display:grid;place-items:center;font-size:10px;line-height:1;color:#0b0f14}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.warn{background:var(--warn);border-color:var(--warn)}
#panel{flex:1;overflow-y:auto;padding:14px 16px 18px}
#panel::-webkit-scrollbar,#right::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb,#right::-webkit-scrollbar-thumb{background:#2a3340;border-radius:4px}
.sec{font-size:11px;letter-spacing:.09em;color:var(--mut);font-weight:600;margin:18px 0 9px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sec b{color:#e6edf3;font-family:ui-monospace,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:8px 0}
.card.active{border-color:#c9d1d9}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
.row>span:first-child{color:#c5cfdb}
.row .val{font-family:ui-monospace,Consolas,monospace;color:#fff;text-align:right}
label.f{display:block;color:var(--mut);font-size:12px;margin:9px 0 4px}
input[type=text],input[type=number],select{background:#0b1017;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.row input[type=number],.row select{width:118px;text-align:right}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chip:hover{border-color:#3a4554}.chip.on{border-color:#c9d1d9}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mut{color:var(--mut)}.small{font-size:12px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:7px 0}
.chk i{flex:none;width:11px;height:11px;border-radius:50%;margin-top:4px;background:var(--ok)}
.chk i.no{background:var(--bad)}.chk i.wn{background:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.verdict{border-radius:8px;padding:11px 12px;margin:8px 0;border:1px solid;font-weight:600}
.verdict small{display:block;font-weight:400;margin-top:3px;color:#c5cfdb}
.verdict.ok{border-color:#2d6b45;background:#12261b}.verdict.wn{border-color:#7a6226;background:#2a2312}.verdict.no{border-color:#7d302c;background:#2c1514}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--acc);background:#3a1f17;border-radius:3px;padding:1px 5px;margin-left:6px}
#view{position:relative;min-width:0;min-height:0;background:#0b0f14}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#legend{position:absolute;left:12px;top:12px;width:232px;background:#10161ee6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;pointer-events:none}
#legend .t{font-weight:600}#legend .t span{color:var(--mut);font-weight:400}
#legend .bar{height:6px;border-radius:3px;margin:8px 0 4px;background:linear-gradient(90deg,#3b4cff,#28aae6,#3cc878,#f0d23c,#eb503c)}
#legend .bar.rev{background:linear-gradient(90deg,#eb503c,#f0d23c,#3cc878,#28aae6,#3b4cff)}
#legend .mm{display:flex;justify-content:space-between;font-family:ui-monospace,Consolas,monospace;color:var(--mut)}
#legend .ln{display:flex;align-items:center;gap:8px;margin-top:6px}
#legend .ln i{width:12px;height:3px;border-radius:2px;display:inline-block}
#hint{position:absolute;right:14px;bottom:9px;color:var(--mut);font-size:12px;pointer-events:none}
#prog{display:none;position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#10161ef2;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:330px;align-items:center;gap:12px}
#prog.on{display:flex}
#prog .pb{height:4px;background:#232b36;border-radius:2px;margin-top:6px;overflow:hidden}
#prog .pb i{display:block;height:100%;background:var(--acc);width:0}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);pointer-events:none}
#empty div{max-width:380px}#empty b{display:block;color:#e6edf3;font-size:15px;margin-bottom:6px}
#right{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow-y:auto;margin-right:14px;border-right:1px solid var(--line)}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--card)}
#status{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:var(--mut);font:12px ui-monospace,Consolas,monospace;border-top:1px solid var(--line)}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;place-items:center}
#modal.on{display:grid}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:640px;max-height:84vh;overflow:auto;padding:20px 24px}
#modal h2{margin:0 0 10px;font-size:17px}#modal h3{margin:16px 0 4px;font-size:13px;color:var(--acc)}
#modal p,#modal li{color:#c5cfdb;margin:4px 0}#modal ul,#modal ol{padding-left:20px;margin:4px 0}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2c1514;border:1px solid #7d302c;border-radius:8px;padding:9px 14px;z-index:60;display:none;max-width:560px}
#toast.on{display:block}#toast.info{background:#12261b;border-color:#2d6b45}

#top>*{flex:none}#top>#ptabs{flex:0 1 auto}#top>.sp{flex:1 1 0}
.ptab-add{margin-left:2px}
@media (max-width:1440px){.brandtxt{display:none}}

<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 1.5 18 6v8l-8 4.5L2 14V6z" fill="none" stroke="#e8734f" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 6l8 4.5L18 6M10 10.5v8" fill="none" stroke="#e8734f" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="brandtxt">Analyse éléments finis 3D</span>
    </div>
    <div id="ptabs"></div><button class="ptab-add" data-act="newtab" title="Nouveau projet">+</button>
    <div class="sp"></div>
    <button class="btn" data-act="open">Ouvrir…</button>
    <div class="menu split"><button class="btn" data-act="save" title="Ctrl+S">Enregistrer</button><button class="btn caret" data-act="savemenu" title="Autres options d'enregistrement">▾</button>
      <div id="saveMenu" class="dropdown"><button data-act="saveas">Enregistrer sous… <kbd>Ctrl+Maj+S</kbd></button></div></div>
    <button class="btn primary" data-act="calc">Calculer</button>
    <div class="seg" style="margin-left:8px">
      <button data-view="iso">Iso</button><button data-view="front">Face</button><button data-view="right">Droite</button><button data-view="top">Dessus</button>
    </div>
    <button class="btn" data-act="fit">Ajuster</button>
    <div class="menu">
      <button class="btn" data-act="menu">Affichage ▾</button>
      <div id="viewMenu">
        <label><input type="checkbox" data-set="showEdges" checked> Arêtes du maillage</label>
        <label><input type="checkbox" data-set="showGrid" checked> Grille au sol</label>
        <label><input type="checkbox" data-set="showLabels" checked> Étiquettes des charges</label>
      </div>
    </div>
    <button class="btn" data-act="help">Aide</button>
  </header>
  <aside id="left"><nav id="steps"></nav><div id="panel"></div></aside>
  <main id="view">
    <canvas id="gl"></canvas><canvas id="ov"></canvas>
    <div id="empty"><div><b>Aucune pièce chargée</b>Glissez un fichier STL ici, ou utilisez « Importer un STL… » dans l'onglet Modèle. Vous pouvez aussi charger la pièce d'exemple.</div></div>
    <div id="legend"></div>
    <div id="prog"><div style="flex:1"><div id="progT"></div><div class="pb"><i id="progB"></i></div></div><button class="btn" data-act="stop">Arrêter</button></div>
    <div id="hint">Clic gauche : tourner · Clic droit : déplacer · Molette : zoom</div>
  </main>
  <aside id="right"></aside>
  <footer id="status"><span id="stL"></span><span id="stR"></span></footer>
</div>
<input type="file" id="file" accept=".stl,.json" multiple hidden>
<div id="modal"></div><div id="toast"></div>

<script id="engine">
'use strict';
/* Moteur de calcul : STL, topologie de surface, découpe en cellules, éléments hexaédriques (cellules coupées
   par la vraie surface), gradient conjugué multigrille sans matrice, contraintes, optimisation topologique (SIMP). */
const FEA = (function () {

  /* ---------- STL ---------- */
  function parseSTL(buf) {
    const dv = new DataView(buf), len = buf.byteLength;
    let bin = false;
    if (len >= 84) { const n = dv.getUint32(80, true); if (84 + n * 50 === len) bin = true; }
    if (!bin) {
      const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(len, 4096)));
      if (!/^\s*solid/i.test(head) || !/facet/i.test(head)) bin = len >= 84;
    }
    if (bin) {
      const n = Math.min(dv.getUint32(80, true), Math.floor((len - 84) / 50));
      const t = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) { const o = 84 + i * 50 + 12; for (let k = 0; k < 9; k++) t[i * 9 + k] = dv.getFloat32(o + k * 4, true); }
      return t;
    }
    const txt = new TextDecoder().decode(buf), re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g, a = [];
    let m; while ((m = re.exec(txt))) a.push(+m[1], +m[2], +m[3]);
    a.length -= a.length % 9;
    return new Float32Array(a);
  }

  function geomInfo(tris) {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    let vol = 0, area = 0;
    for (let i = 0; i < tris.length; i += 9) {
      for (let v = 0; v < 3; v++) for (let c = 0; c < 3; c++) { const x = tris[i + v * 3 + c]; if (x < mn[c]) mn[c] = x; if (x > mx[c]) mx[c] = x; }
      const ax = tris[i], ay = tris[i + 1], az = tris[i + 2], bx = tris[i + 3], by = tris[i + 4], bz = tris[i + 5], cx = tris[i + 6], cy = tris[i + 7], cz = tris[i + 8];
      vol += (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
      const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx - ax, vy = cy - ay, vz = cz - az;
      area += 0.5 * Math.hypot(uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx);
    }
    return { min: mn, max: mx, size: [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]], volume: Math.abs(vol), area };
  }

  /* ---------- Topologie de surface (voisinage des triangles) ---------- */
  function buildTopology(tris) {
    const nt = tris.length / 9, gi = geomInfo(tris);
    const diag = Math.hypot(gi.size[0], gi.size[1], gi.size[2]) || 1, inv = 1 / (diag * 1e-6);
    const map = new Map(), vid = new Int32Array(nt * 3); let nv = 0;
    for (let i = 0; i < nt * 3; i++) {
      const key = Math.round(tris[i * 3] * inv) + ',' + Math.round(tris[i * 3 + 1] * inv) + ',' + Math.round(tris[i * 3 + 2] * inv);
      let id = map.get(key); if (id === undefined) { id = nv++; map.set(key, id); } vid[i] = id;
    }
    const normals = new Float32Array(nt * 3), areas = new Float32Array(nt);
    for (let t = 0; t < nt; t++) {
      const i = t * 9, ux = tris[i + 3] - tris[i], uy = tris[i + 4] - tris[i + 1], uz = tris[i + 5] - tris[i + 2];
      const vx = tris[i + 6] - tris[i], vy = tris[i + 7] - tris[i + 1], vz = tris[i + 8] - tris[i + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz);
      areas[t] = l / 2; if (l > 0) { normals[t * 3] = nx / l; normals[t * 3 + 1] = ny / l; normals[t * 3 + 2] = nz / l; }
    }
    const adj = new Int32Array(nt * 3).fill(-1), em = new Map();
    for (let t = 0; t < nt; t++) for (let e = 0; e < 3; e++) {
      const a = vid[t * 3 + e], b = vid[t * 3 + (e + 1) % 3]; if (a === b) continue;
      const key = a < b ? a * nv + b : b * nv + a, o = em.get(key);
      if (o === undefined) em.set(key, t * 3 + e);
      else if (o >= 0) { adj[t * 3 + e] = (o / 3) | 0; adj[o] = t; em.set(key, -1); }
    }
    return { nt, adj, normals, areas };
  }

  function flood(topo, seed, cosTol, toSeed) {
    const { adj, normals: N } = topo, seen = new Uint8Array(topo.nt), out = [seed], st = [seed]; seen[seed] = 1;
    while (st.length) {
      const t = st.pop();
      const r = toSeed ? seed : t;
      for (let e = 0; e < 3; e++) {
        const o = adj[t * 3 + e]; if (o < 0 || seen[o]) continue;
        const d = N[r * 3] * N[o * 3] + N[r * 3 + 1] * N[o * 3 + 1] + N[r * 3 + 2] * N[o * 3 + 2];
        if (d >= cosTol) { seen[o] = 1; out.push(o); st.push(o); }
      }
    }
    return out;
  }

  /* mode : 'auto' | 'plane' | 'tangent' */
  function selectRegion(topo, seed, mode, tolDeg) {
    const cosP = Math.cos(2 * Math.PI / 180), cosT = Math.cos(tolDeg * Math.PI / 180);
    if (mode === 'tangent') return flood(topo, seed, cosT, false);
    const P = flood(topo, seed, cosP, true);
    if (mode === 'plane' || P.length >= 3) return P;
    const inP = new Set(P), N = topo.normals;
    for (const t of P) for (let e = 0; e < 3; e++) {
      const o = topo.adj[t * 3 + e]; if (o < 0 || inP.has(o)) continue;
      const d = N[t * 3] * N[o * 3] + N[t * 3 + 1] * N[o * 3 + 1] + N[t * 3 + 2] * N[o * 3 + 2];
      if (d >= cosT) return flood(topo, seed, cosT, false);
    }
    return P;
  }

  /* ---------- Voxelisation ---------- */
  /* Découpe la pièce sur une grille de pas h. Chaque cellule est divisée en 8 octants ;
     frac[cellule*8 + octant] = part de l'octant occupée par la matière (0 à 1), mesurée par
     des rayons selon z (s×s rayons par cellule, longueur exacte le long de z). */
  function voxelize(tris, h) {
    const gi = geomInfo(tris), n = [0, 0, 0], o = [0, 0, 0];
    for (let c = 0; c < 3; c++) { n[c] = Math.max(1, Math.ceil(gi.size[c] / h - 1e-6)); o[c] = (gi.min[c] + gi.max[c]) / 2 - n[c] * h / 2; }
    const [nx, ny, nz] = n, [ox, oy, oz] = o;
    const s = nx * ny * 100 <= 2e7 ? 10 : nx * ny * 64 <= 2e7 ? 8 : nx * ny * 36 <= 2e7 ? 6 : 4, hs = h / s, NX = nx * s, NY = ny * s, px = hs * 1.37e-4, py = hs * 2.11e-4;
    const cnt = new Int32Array(NX * NY + 1); let zs = null;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < tris.length; i += 9) {
        const ax = tris[i], ay = tris[i + 1], az = tris[i + 2], bx = tris[i + 3], by = tris[i + 4], bz = tris[i + 5], cx = tris[i + 6], cy = tris[i + 7], cz = tris[i + 8];
        const d = (bx - ax) * (cy - ay) - (cx - ax) * (by - ay);
        if (Math.abs(d) < 1e-14) continue;
        const i0 = Math.max(0, Math.ceil((Math.min(ax, bx, cx) - ox - px) / hs - 0.5)), i1 = Math.min(NX - 1, Math.floor((Math.max(ax, bx, cx) - ox - px) / hs - 0.5));
        const j0 = Math.max(0, Math.ceil((Math.min(ay, by, cy) - oy - py) / hs - 0.5)), j1 = Math.min(NY - 1, Math.floor((Math.max(ay, by, cy) - oy - py) / hs - 0.5));
        for (let j = j0; j <= j1; j++) {
          const y = oy + (j + 0.5) * hs + py;

  function panelStudy() {

  function panelResults() {

    return `${S.stale ? '<div class="verdict wn">Résultats périmés<small>L\'étude a changé depuis le dernier calcul. Relancez « Calculer ».</small></div>' : ''}

    <input type="range" min="0" max="1000" step="1" value="${Math.round(p * 1000)}" data-live="def" list="defTicks" ${S.showDef ? '' : 'disabled'}><datalist id="defTicks"><option value="0"></option><option value="${Math.round(g.pAuto * 1000)}"></option><option value="1000"></option></datalist>

    <div class="sec">À SAVOIR</div><div class="mut small">Les résultats sont affichés sur la vraie surface de la pièce. Comme dans tout calcul par éléments finis, la contrainte reste théoriquement infinie au bord d'un appui fixe et dans un angle rentrant vif : si le maximum s'y trouve et monte sans cesse en affinant, c'est un pic numérique. Ailleurs, affinez le maillage jusqu'à ce que le maximum se stabilise.${r.spin !== null && r.spin !== undefined ? '<br><br>Un seul axe tient la pièce : c\'est une articulation, et rien d\'autre ne l\'empêche de pivoter en bloc autour de lui. Ce pivotement (' + fmt(r.spin * 180 / Math.PI, 2) + '°) est retiré du déplacement et de la déformée affichés ; il n\'a aucun effet sur les contraintes. Si la pièce est tenue autrement en réalité, ajoutez cet appui.' : ''}<br><br>${r.tet ? fmt(r.tet.nt, 7) + ' tétraèdres' : fmt(S.mesh.ne, 7) + ' éléments'} · ${r.rounds ? r.rounds + ' passes de contact · ' : ''}${fmt(r.time, 2)} s</div>`;

  function panelOpt() {

      ${v ? `<div class="row"><span>von Mises maximale</span><span class="val">${fmt(v.maxVm, 4)} MPa</span></div><div class="row"><span>von Mises, 99ᵉ centile</span><span class="val">${fmt(v.p99, 4)} MPa</span></div><div class="row"><span>Déplacement maximal</span><span class="val">${fmt(v.maxD, 4)} mm</span></div>

    }

    else if (S.tab === 'opt' && S.opt.x) h = `<div class="t">Forme optimisée</div><div class="ln"><i style="background:#e8855c"></i>Matière conservée (densité > ${fmt(S.opt.thr, 2)})</div>`;
    else if ((S.tab === 'mesh' || S.tab === 'results' || S.tab === 'opt') && S.mesh) h = `<div class="t">Maillage <span>(éléments de ${fmt(S.mesh.h)} mm)</span></div><div class="ln"><i style="background:#809ec7"></i>${S.elType === 'tet' && S.mesh.tet ? fmt(S.mesh.tet.nt, 7) + ' tétraèdres' : fmt(S.mesh.ne, 7) + ' éléments'}</div>`;
    else if (S.tris) h = `<div class="t">Géométrie</div><div class="ln"><i style="background:#e8734f"></i>Sélection</div><div class="ln"><i style="background:${hex(BCC.fix)}"></i>Appui fixe</div><div class="ln"><i style="background:${hex(BCC.pin)}"></i>Axe / boulon</div><div class="ln"><i style="background:${hex(BCC.disp)}"></i>Déplacement imposé</div><div class="ln"><i style="background:${hex(BCC.force)}"></i>Force</div>`;
    L.innerHTML = h; L.style.display = h ? '' : 'none';
  }
  function ui() {
    const c = checks(), ok = { model: c.geo, mesh: c.mesh, study: c.sup > 0 && c.ld > 0, results: !!S.res && !S.stale, opt: !!S.opt.x };
    $('#steps').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}"><span class="dot ${ok[k] ? 'ok' : (k === 'results' && S.res ? 'warn' : '')}">${ok[k] ? '✓' : ''}</span>${n}</button>`).join('');
    $('#panel').innerHTML = { model: panelModel, mesh: panelMesh, study: panelStudy, results: panelResults, opt: panelOpt }[S.tab]();
    $('#right').innerHTML = rightPanel(); renderTabs();
    $('#stL').textContent = S.mesh && S.elType === 'tet' && S.mesh.tet ? fmt(S.mesh.tet.nn, 7) + ' nœuds · ' + fmt(S.mesh.tet.nt, 7) + ' tétraèdres' : S.mesh ? fmt(S.mesh.nn, 7) + ' nœuds · ' + fmt(S.mesh.ne, 7) + ' éléments' : S.tris ? fmt(S.surf.nt, 7) + ' triangles' : 'Aucune pièce';
    $('#stR').textContent = 'Axe vertical Y · mm · ' + S.forceUnit + ' · MPa';
    legend(); R.need = true;
  }

  /* ---------- événements ---------- */
  const ACT = {
    open: openDialog, import: openDialog, demo: loadDemo, save: () => save(false), saveas: () => { $('#saveMenu').classList.remove('open'); save(true); }, calc, fit, stop,
    savemenu: () => $('#saveMenu').classList.toggle('open'), newtab: newProject,
    closenosave: el => { $('#modal').classList.remove('on'); closeProject(+el.dataset.i, true); },
    closesave: async el => { $('#modal').classList.remove('on'); const i = +el.dataset.i, P = PROJ[i]; if (P !== S) activate(i); if (await save(false)) closeProject(PROJ.indexOf(P), true); },
    defreal: () => { S.defPos = 0; resBuffers(); ui(); }, defauto: () => { S.defPos = null; resBuffers(); ui(); },
    menu: () => $('#viewMenu').classList.toggle('open'), help,
    mesh: () => { if (genMesh()) ui(); }, hfine: () => { S.h = +(S.h / 1.25).toPrecision(3); ui(); }, hcoarse: () => { S.h = +(S.h * 1.25).toPrecision(3); ui(); },
    addfix: () => addBC('fix'), addpin: () => addBC('pin'), verify: runVerify, adddisp: () => addBC('disp'), addforce: () => addBC('force'), clearsel: () => { S.sel.fill(0); geoColors(); ui(); },
    bc: el => { const id = +el.dataset.id; S.activeBC = S.activeBC === id ? null : id; geoColors(); ui(); },
    bcdel: () => { S.dirty = true; S.bcs = S.bcs.filter(b => b.id !== S.activeBC); S.activeBC = null; S.stale = !!S.res; geoColors(); ui(); },
    bcsel: () => { const b = S.bcs.find(x => x.id === S.activeBC); if (b) { S.sel.fill(0); for (const t of b.tris) S.sel[t] = 1; geoColors(); ui(); } },
    opt: runOpt, optstl: exportOptSTL, closemodal: () => $('#modal').classList.remove('on')
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu')) { $('#viewMenu').classList.remove('open'); $('#saveMenu').classList.remove('open'); }
    const pc = e.target.closest('[data-pclose]');
    if (pc) { e.stopPropagation(); if (S.busy) { toast('Un calcul est en cours : arrêtez-le avant de changer de projet.'); return; } closeProject(+pc.dataset.pclose); return; }
    const pt = e.target.closest('[data-ptab]');
    if (pt) { if (S.busy && PROJ[+pt.dataset.ptab] !== S) { toast('Un calcul est en cours : arrêtez-le avant de changer de projet.'); return; } activate(+pt.dataset.ptab); return; }
    const t = e.target.closest('[data-act],[data-tab],[data-view],[data-res],[data-mode],[data-optmode],[data-eltype]');
    if (!t || t.disabled) return; const d = t.dataset;
    if (d.act) { if (S.busy && !['stop', 'help', 'closemodal', 'menu', 'fit', 'defreal', 'defauto'].includes(d.act)) { if (['newtab', 'open', 'demo', 'import'].includes(d.act)) toast('Un calcul est en cours : arrêtez-le avant d\'ouvrir un autre projet.'); return; } ACT[d.act](t); }
    else if (d.tab) { S.tab = d.tab; S.probe = null; geoColors(); optBuffers(); if (d.tab === 'results') resBuffers(); ui(); }
    else if (d.view) setView(d.view);
    else if (d.res) { S.resField = d.res; S.probe = null; resBuffers(); ui(); }
    else if (d.eltype) { if (!S.busy && S.elType !== d.eltype) { S.elType = d.eltype; S.dirty = true; if (S.gi) S.h = +(defaultH() * (d.eltype === 'tet' ? 2 : 1)).toPrecision(2); S.res = null; resBuffers(); ui(); } }
    else if (d.optmode) { if (!S.busy) { S.opt.mode = d.optmode; S.dirty = true; ui(); } }
    else if (d.mode) { S.selMode = d.mode; S.hoverSeed = -1; S.hoverMask = null; ui(); }
  });
  const VIEW_ONLY = new Set(['showEdges', 'showGrid', 'showLabels', 'showDef', 'opt.thr', 'opt.colorVm', 'selTol', 'fsTarget']);
  document.addEventListener('change', e => {
    const el = e.target, p = el.dataset.set; if (!p) return;
    const v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range' || el.dataset.num) ? parseFloat(el.value) : el.value;
    if ((el.type === 'number' || el.type === 'range') && !isFinite(v)) { ui(); return; }
    if (!VIEW_ONLY.has(p)) S.dirty = true;
    const b = S.bcs.find(x => x.id === S.activeBC);
    if (p.startsWith('bc.')) {
      if (!b) return; const k = p.slice(3);
      if (k === 'name') b.name = v || b.name; else if (k[0] === 'f' && k.length === 2) b.v[+k[1]] = v * fU(); else if (k[0] === 'd') b.v[+k[1]] = v; else if (k.startsWith('fix')) b.free[+k[3]] = !v; else if (k === 'bearing') b.bearing = v; else if (k === 'stick') b.stick = v;
      if (k !== 'name') S.stale = !!S.res;
    } else if (p === 'unit') { S.unit = v; applyUnit(); S.h = defaultH(); }
    else if (p === 'matIdx') { S.matIdx = v; S.mat = Object.assign({}, MATS[v]); S.stale = !!S.res; }
    else if (p.startsWith('mat.')) { const k = p.slice(4); if (!(v > 0) || (k === 'nu' && v >= 0.499)) { toast('Valeur de matériau invalide.'); ui(); return; } S.mat[k] = v; S.matIdx = MATS.length - 1; S.mat.n = 'Personnalisé'; if (k === 'E' || k === 'nu') S.stale = !!S.res; }
    else if (p.startsWith('opt.')) { S.opt[p.slice(4)] = v; if (p === 'opt.thr' || p === 'opt.colorVm') { S.probe = null; optBuffers(); } }
    else if (p === 'h') { if (v > 0) S.h = v; }
    else if (p === 'selTol') { S.selTol = Math.max(1, Math.min(60, v)); S.hoverSeed = -1; S.hoverMask = null; }
    else if (p === 'fsTarget') { if (v > 0) S.fsTarget = v; resBuffers(); }
    else { S[p] = v; if (p === 'showDef') resBuffers(); }
    ui();
  });
  let defRaf = 0;
  document.addEventListener('input', e => {
    const el = e.target; if (el.dataset.live !== 'def') return;
    S.defPos = +el.value / 1000; const l = $('#defLbl'); if (l) l.textContent = '× ' + fmt(defScale(), 3);
    if (!defRaf) defRaf = requestAnimationFrame(() => { defRaf = 0; resBuffers(); legend(); });
  });
  $('#file').addEventListener('change', e => { for (const f of e.target.files) openFile(f); e.target.value = ''; });
  const view = $('#view');
  view.addEventListener('dragover', e => e.preventDefault());
  view.addEventListener('drop', e => { e.preventDefault(); if (S.busy) return; for (const f of e.dataTransfer.files) openFile(f); });
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); if (!S.busy) save(e.shiftKey); return; }
      if (k === 'o') { e.preventDefault(); if (!S.busy) openDialog(); return; }
    }
    if (e.key === 'Escape') { $('#saveMenu').classList.remove('open'); $('#modal').classList.remove('on'); if (S.sel && selectable() && !/INPUT|SELECT/.test(document.activeElement.tagName)) { S.sel.fill(0); geoColors(); ui(); } } });
  function help() {
    $('#modal').innerHTML = `<div class="box"><h2>Analyse éléments finis 3D — aide</h2>
    <h3>Déroulement</h3><ol><li><b>Modèle</b> : importez le STL de la pièce, vérifiez les dimensions et choisissez le matériau.</li><li><b>Maillage</b> : réglez la taille d'élément et générez le maillage.</li><li><b>Étude</b> : cliquez les faces dans la vue, puis créez les appuis et les forces (panneau de droite).</li><li><b>Calculer</b>, puis lisez le bilan dans <b>Résultats</b>.</li><li><b>Optimisation</b> (facultatif) : cherchez la matière inutile sous le même cas de charge, en visant une quantité de matière ou un facteur de sécurité.</li></ol>
    <h3>Exporter depuis SolidWorks</h3><p>Fichier › Enregistrer sous › STL (*.stl). Dans Options : unité « Millimètres », résolution « Fine ». Une résolution fine donne des alésages plus ronds et des sélections de faces plus propres.</p>
    <h3>Ce que fait le calcul</h3><ul><li>Statique linéaire élastique, petits déplacements, matériau isotrope.</li><li>Deux maillages au choix : des cubes coupés par la vraie surface (robuste, sert aussi à l'optimisation), ou des tétraèdres à 10 nœuds (plus précis à nombre d'éléments égal). Plus les éléments sont petits, plus le résultat est précis et le calcul long.</li><li>Une force est répartie uniformément sur les faces choisies, ou seulement du côté où l'axe pousse si « Charge de palier » est cochée.</li><li><b>Appui fixe</b> : la face est soudée à un bâti rigide. <b>Axe / boulon</b> : l'alésage n'est retenu que du côté où il s'appuie sur l'axe ; l'axe est supposé rigide et sans jeu, et la matière glisse autour de lui (ou non, avec l'option « Boulon serré »).</li></ul>
    <h3>Limites à garder en tête</h3><ul><li>Pas de contact, de flambage, de fatigue ni de plasticité.</li><li>Les pics de contrainte au bord des appuis fixes et dans les angles rentrants vifs sont souvent numériques : confirmez en affinant.</li><li>Pour une pièce critique pour la sécurité, validez avec un logiciel certifié ou un essai.</li></ul>
    <h3>Projets</h3><p>Chaque onglet en haut est un projet ; « + » en crée un nouveau. Ouvrir un fichier l'ouvre dans un nouvel onglet. Un point orange signale des modifications non enregistrées. <kbd>Ctrl+S</kbd> : enregistrer (la première fois, choix de l'emplacement) · <kbd>Ctrl+Maj+S</kbd> : enregistrer sous · <kbd>Ctrl+O</kbd> : ouvrir.</p><h3>Souris</h3><p>Clic gauche : tourner · clic droit : déplacer · molette : zoom · <kbd>Échap</kbd> : vider la sélection.</p>
    <div class="btns" style="justify-content:flex-end"><button class="btn primary" data-act="closemodal">Fermer</button></div></div>`;
    $('#modal').classList.add('on');
  }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.classList.remove('on'); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  ui();
})();
</script>
</body></html>
